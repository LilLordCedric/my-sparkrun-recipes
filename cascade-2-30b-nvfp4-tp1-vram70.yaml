name: cascade_v1-2-30b
format: nvpf4
description: cascade-2-30b | vllm-distributed | FP8
runtime: vllm-distributed
model: chankhavu/Nemotron-Cascade-2-30B-A3B-NVFP4
container: vllm-node
defaults:
  gpu_memory_utilization: 0.7
  max_model_len: 262144
  port: 7010
  tensor_parallel: 1
command: 'vllm serve {model} --mamba_ssm_cache_dtype float32 --moe-backend cutlass
  --max-model-len {max_model_len} --port {port} --host 0.0.0.0 --trust-remote-code
  --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser nemotron_v3
  --kv-cache-dtype fp8 --enable-prefix-caching --load-format fastsafetensors --gpu-memory-utilization
  {gpu_memory_utilization} --tensor-parallel-size {tensor_parallel}

  '