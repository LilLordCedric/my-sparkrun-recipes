name: gpt-oss-120b
format: mxfp4
description: gpt-oss-120b | vllm-ray | FP8
runtime: vllm-ray
model: openai/gpt-oss-120b
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:latest
defaults:
  gpu_memory_utilization: 0.7
  max_model_len: 131072
  max_num_batched_tokens: 8192
  max_num_seqs: 16
  port: 7010
  tensor_parallel: 1
command: 'vllm serve {model} --tool-call-parser openai --reasoning-parser openai_gptoss
  --enable-auto-tool-choice --distributed-executor-backend ray --gpu-memory-utilization
  {gpu_memory_utilization} --max-model-len 131072 --max-num-seqs {max_num_seqs} --enable-prefix-caching
  --load-format fastsafetensors --quantization mxfp4 --attention-backend TRITON_ATTN
  --kv-cache-dtype fp8 --max-num-batched-tokens {max_num_batched_tokens} --host 0.0.0.0
  --port {port} --tensor-parallel-size {tensor_parallel}

  '
environment:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
  VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: '1'
